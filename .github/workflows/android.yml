name: Private TV checks
on:
  push:
    branches: [main, feature/private-selfhosted]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          accept-android-sdk-licenses: false
      - name: Privacy regression audit
        run: python3 scripts/check_private_runtime.py
      - name: Unit tests, lint, and unsigned release
        run: ./gradlew :app:testDebugUnitTest :mediaslider:mediaslider:testDebugUnitTest :app:lintDebug :app:assembleRelease
      - name: Inspect release APK and merged manifest
        shell: bash
        run: |
          APK=$(find app/build/outputs/apk/release -maxdepth 1 -name '*.apk' -print -quit)
          MANIFEST=$(find app/build/intermediates/merged_manifests/release -name AndroidManifest.xml -print -quit)
          test -n "$APK" && test -n "$MANIFEST"
          python3 scripts/check_private_apk.py "$APK" --merged-manifest "$MANIFEST"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: immich-tv-private-checks
          path: |
            app/build/reports/
            app/build/test-results/
            mediaslider/mediaslider/build/reports/
  sign:
    needs: check
    if: github.repository == 'z979054461/Immich-Android-TV' && github.event_name != 'pull_request' && (github.ref == 'refs/heads/feature/private-selfhosted' || github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          accept-android-sdk-licenses: false
      - name: Build with dedicated private-app signing key
        shell: bash
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
          RELEASE_CERT_SHA256: ${{ secrets.RELEASE_CERT_SHA256 }}
        run: |
          set -euo pipefail
          test -n "$RELEASE_KEYSTORE_BASE64" && test -n "$RELEASE_KEYSTORE_PASSWORD" && test -n "$RELEASE_KEY_PASSWORD" && test -n "$RELEASE_CERT_SHA256"
          SIGN_DIR=$(mktemp -d "$RUNNER_TEMP/immich-private-signing.XXXXXX")
          trap 'rm -rf "$SIGN_DIR"' EXIT
          chmod 700 "$SIGN_DIR"
          export RELEASE_KEYSTORE_PATH="$SIGN_DIR/release.jks"
          printf '%s' "$RELEASE_KEYSTORE_BASE64" | base64 --decode > "$RELEASE_KEYSTORE_PATH"
          chmod 600 "$RELEASE_KEYSTORE_PATH"
          java scripts/ResolveSigningAlias.java "$RELEASE_KEYSTORE_PATH" "$SIGN_DIR/alias.txt"
          export RELEASE_KEY_ALIAS=$(cat "$SIGN_DIR/alias.txt")
          ./gradlew :app:assembleRelease
          APK=$(find app/build/outputs/apk/release -maxdepth 1 -name '*.apk' -print -quit)
          MANIFEST=$(find app/build/intermediates/merged_manifests/release -name AndroidManifest.xml -print -quit)
          python3 scripts/check_private_apk.py "$APK" --merged-manifest "$MANIFEST"
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -1)
          "$APKSIGNER" verify --verbose --print-certs "$APK" > "$SIGN_DIR/verification.txt"
          ACTUAL=$(sed -n 's/^Signer #1 certificate SHA-256 digest: //p' "$SIGN_DIR/verification.txt" | head -1 | tr -d ':[:space:]' | tr '[:upper:]' '[:lower:]')
          EXPECTED=$(printf '%s' "$RELEASE_CERT_SHA256" | tr -d ':[:space:]' | tr '[:upper:]' '[:lower:]')
          test -n "$ACTUAL" && test "$ACTUAL" = "$EXPECTED"
          mkdir -p deliverables
          cp "$APK" deliverables/ImmichTV-Private-1.0.0.apk
          sha256sum deliverables/ImmichTV-Private-1.0.0.apk > deliverables/SHA256SUMS.txt
          printf '%s\n' "$ACTUAL" > deliverables/SIGNING-CERT-SHA256.txt
          git archive --format=zip -o deliverables/ImmichTV-Private-1.0.0-source.zip HEAD
      - uses: actions/upload-artifact@v4
        with:
          name: immich-tv-private-signed
          path: deliverables/
          if-no-files-found: error
