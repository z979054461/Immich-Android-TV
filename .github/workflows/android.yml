name: Private TV checks
on:
  push:
    branches: [main, feature/private-selfhosted]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Prepare verified Gradle 9.6.1
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          grep -q 'gradle-9.6.1-all.zip' gradle/wrapper/gradle-wrapper.properties
          GRADLE_DIST="$RUNNER_TEMP/gradle-dist"
          mkdir -p "$GRADLE_DIST"
          gh release download v9.6.1 --repo gradle/gradle-distributions --pattern gradle-9.6.1-bin.zip --dir "$GRADLE_DIST"
          printf '%s  %s\n' '9c0f7faeeb306cb14e4279a3e084ca6b596894089a0638e68a07c945a32c9e14' "$GRADLE_DIST/gradle-9.6.1-bin.zip" | sha256sum --check --strict
          unzip -q "$GRADLE_DIST/gradle-9.6.1-bin.zip" -d "$GRADLE_DIST"
          echo "$GRADLE_DIST/gradle-9.6.1/bin" >> "$GITHUB_PATH"
      - name: Prepare verified Kotlin compiler mirror
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          KOTLIN_MIRROR="$RUNNER_TEMP/kotlin-mirror/org/jetbrains/kotlin/kotlin-compiler-embeddable/2.4.0"
          mkdir -p "$KOTLIN_MIRROR"
          gh release download v2.4.0 --repo JetBrains/kotlin --pattern kotlin-compiler-embeddable-2.4.0.jar --dir "$KOTLIN_MIRROR"
          printf '%s  %s\n' 'c2b25e8c1c93ec416ba4327f5e31eaec0f0c8847241b9353e294b8db9dce564f' "$KOTLIN_MIRROR/kotlin-compiler-embeddable-2.4.0.jar" | sha256sum --check --strict
          curl --fail --location --retry 3 --output "$KOTLIN_MIRROR/kotlin-compiler-embeddable-2.4.0.pom" 'https://repo.maven.apache.org/maven2/org/jetbrains/kotlin/kotlin-compiler-embeddable/2.4.0/kotlin-compiler-embeddable-2.4.0.pom'
          cat > "$RUNNER_TEMP/kotlin-mirror.init.gradle" <<'GRADLE'
          allprojects {
              repositories {
                  exclusiveContent {
                      forRepository {
                          maven { url = uri(System.getenv('RUNNER_TEMP') + '/kotlin-mirror') }
                      }
                      filter { includeModule('org.jetbrains.kotlin', 'kotlin-compiler-embeddable') }
                  }
              }
          }
          GRADLE
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          accept-android-sdk-licenses: false
      - name: Privacy regression audit
        run: python3 scripts/check_private_runtime.py
      - name: Unit tests, lint, and unsigned release
        run: gradle --init-script "$RUNNER_TEMP/kotlin-mirror.init.gradle" :app:testDebugUnitTest :mediaslider:mediaslider:testDebugUnitTest :app:lintDebug :app:assembleRelease
      - name: Inspect release APK and merged manifest
        shell: bash
        run: |
          set -euo pipefail
          APK=$(find app/build/outputs/apk/release -maxdepth 1 -name '*.apk' -print -quit)
          MANIFEST=$(find app/build/intermediates/merged_manifests/release -name AndroidManifest.xml -print -quit)
          [[ -n "$APK" && -n "$MANIFEST" ]]
          APKANALYZER=$(command -v apkanalyzer || find "$ANDROID_HOME/cmdline-tools" -type f -name apkanalyzer -executable | sort -V | tail -1)
          [[ -n "$APKANALYZER" && -x "$APKANALYZER" ]]
          APK_MANIFEST=$(mktemp "$RUNNER_TEMP/immich-apk-manifest.XXXXXX.xml")
          trap 'rm -f "$APK_MANIFEST"' EXIT
          "$APKANALYZER" manifest print "$APK" > "$APK_MANIFEST"
          test -s "$APK_MANIFEST"
          python3 scripts/check_private_apk.py "$APK" --apk-manifest "$APK_MANIFEST" --merged-manifest "$MANIFEST"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: immich-tv-private-checks
          path: |
            app/build/reports/
            app/build/test-results/
            mediaslider/mediaslider/build/reports/
  sign:
    needs: check
    if: github.repository == 'z979054461/Immich-Android-TV' && github.event_name != 'pull_request' && (github.ref == 'refs/heads/feature/private-selfhosted' || github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Prepare verified Gradle 9.6.1
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          grep -q 'gradle-9.6.1-all.zip' gradle/wrapper/gradle-wrapper.properties
          GRADLE_DIST="$RUNNER_TEMP/gradle-dist"
          mkdir -p "$GRADLE_DIST"
          gh release download v9.6.1 --repo gradle/gradle-distributions --pattern gradle-9.6.1-bin.zip --dir "$GRADLE_DIST"
          printf '%s  %s\n' '9c0f7faeeb306cb14e4279a3e084ca6b596894089a0638e68a07c945a32c9e14' "$GRADLE_DIST/gradle-9.6.1-bin.zip" | sha256sum --check --strict
          unzip -q "$GRADLE_DIST/gradle-9.6.1-bin.zip" -d "$GRADLE_DIST"
          echo "$GRADLE_DIST/gradle-9.6.1/bin" >> "$GITHUB_PATH"
      - name: Prepare verified Kotlin compiler mirror
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          KOTLIN_MIRROR="$RUNNER_TEMP/kotlin-mirror/org/jetbrains/kotlin/kotlin-compiler-embeddable/2.4.0"
          mkdir -p "$KOTLIN_MIRROR"
          gh release download v2.4.0 --repo JetBrains/kotlin --pattern kotlin-compiler-embeddable-2.4.0.jar --dir "$KOTLIN_MIRROR"
          printf '%s  %s\n' 'c2b25e8c1c93ec416ba4327f5e31eaec0f0c8847241b9353e294b8db9dce564f' "$KOTLIN_MIRROR/kotlin-compiler-embeddable-2.4.0.jar" | sha256sum --check --strict
          curl --fail --location --retry 3 --output "$KOTLIN_MIRROR/kotlin-compiler-embeddable-2.4.0.pom" 'https://repo.maven.apache.org/maven2/org/jetbrains/kotlin/kotlin-compiler-embeddable/2.4.0/kotlin-compiler-embeddable-2.4.0.pom'
          cat > "$RUNNER_TEMP/kotlin-mirror.init.gradle" <<'GRADLE'
          allprojects {
              repositories {
                  exclusiveContent {
                      forRepository {
                          maven { url = uri(System.getenv('RUNNER_TEMP') + '/kotlin-mirror') }
                      }
                      filter { includeModule('org.jetbrains.kotlin', 'kotlin-compiler-embeddable') }
                  }
              }
          }
          GRADLE
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          accept-android-sdk-licenses: false
      - name: Build with dedicated private-app signing key
        shell: bash
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
          RELEASE_CERT_SHA256: ${{ secrets.RELEASE_CERT_SHA256 }}
        run: |
          set -euo pipefail
          : "${RELEASE_KEYSTORE_BASE64:?Missing signing secret RELEASE_KEYSTORE_BASE64}"
          : "${RELEASE_KEYSTORE_PASSWORD:?Missing signing secret RELEASE_KEYSTORE_PASSWORD}"
          : "${RELEASE_KEY_PASSWORD:?Missing signing secret RELEASE_KEY_PASSWORD}"
          : "${RELEASE_CERT_SHA256:?Missing signing secret RELEASE_CERT_SHA256}"
          SIGN_DIR=$(mktemp -d "$RUNNER_TEMP/immich-private-signing.XXXXXX")
          trap 'rm -rf "$SIGN_DIR"' EXIT
          chmod 700 "$SIGN_DIR"
          export RELEASE_KEYSTORE_PATH="$SIGN_DIR/release.jks"
          printf '%s' "$RELEASE_KEYSTORE_BASE64" | base64 --decode > "$RELEASE_KEYSTORE_PATH"
          chmod 600 "$RELEASE_KEYSTORE_PATH"
          java scripts/ResolveSigningAlias.java "$RELEASE_KEYSTORE_PATH" "$SIGN_DIR/alias.txt"
          export RELEASE_KEY_ALIAS=$(cat "$SIGN_DIR/alias.txt")
          gradle --init-script "$RUNNER_TEMP/kotlin-mirror.init.gradle" :app:assembleRelease
          APK=$(find app/build/outputs/apk/release -maxdepth 1 -name '*.apk' -print -quit)
          MANIFEST=$(find app/build/intermediates/merged_manifests/release -name AndroidManifest.xml -print -quit)
          [[ -n "$APK" && -n "$MANIFEST" ]]
          APKANALYZER=$(command -v apkanalyzer || find "$ANDROID_HOME/cmdline-tools" -type f -name apkanalyzer -executable | sort -V | tail -1)
          [[ -n "$APKANALYZER" && -x "$APKANALYZER" ]]
          "$APKANALYZER" manifest print "$APK" > "$SIGN_DIR/apk-manifest.xml"
          test -s "$SIGN_DIR/apk-manifest.xml"
          python3 scripts/check_private_apk.py "$APK" --apk-manifest "$SIGN_DIR/apk-manifest.xml" --merged-manifest "$MANIFEST"
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -1)
          if ! "$APKSIGNER" verify --verbose --print-certs "$APK" > "$SIGN_DIR/verification.txt" 2>&1; then
            cat "$SIGN_DIR/verification.txt"
            echo "::error::APK signature verification failed"
            exit 1
          fi
          cat "$SIGN_DIR/verification.txt"
          ACTUAL=$(sed -nE 's/^Signer.* certificate SHA-256 digest: ([[:xdigit:]:]+)[[:space:]]*$/\1/p' "$SIGN_DIR/verification.txt" | tr -d ':' | tr '[:upper:]' '[:lower:]' | sort -u)
          EXPECTED=$(printf '%s' "$RELEASE_CERT_SHA256" | tr -d ':[:space:]' | tr '[:upper:]' '[:lower:]')
          [[ "$ACTUAL" =~ ^[0-9a-f]{64}$ ]] || { echo "::error::Expected exactly one unique APK signer SHA-256 digest"; exit 1; }
          [[ "$ACTUAL" = "$EXPECTED" ]] || { echo "::error::APK signer certificate does not match the pinned dedicated key"; exit 1; }
          mkdir -p deliverables
          cp "$APK" deliverables/ImmichTV-Private-1.0.0.apk
          sha256sum deliverables/ImmichTV-Private-1.0.0.apk > deliverables/SHA256SUMS.txt
          printf '%s\n' "$ACTUAL" > deliverables/SIGNING-CERT-SHA256.txt
          git archive --format=zip -o deliverables/ImmichTV-Private-1.0.0-source.zip HEAD
      - uses: actions/upload-artifact@v4
        with:
          name: immich-tv-private-signed
          path: deliverables/
          if-no-files-found: error
